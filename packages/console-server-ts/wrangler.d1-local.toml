name = "seams-sdk-d1-local"
main = "../wallet-console-server-ts/src/router/cloudflare/d1LocalDevWorker.ts"
compatibility_date = "2026-04-17"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "CONSOLE_DB"
database_name = "seams-console"
database_id = "00000000-0000-0000-0000-000000000101"
preview_database_id = "00000000-0000-0000-0000-000000000102"
migrations_dir = "../wallet-console-server-ts/migrations/d1-console"

[[d1_databases]]
binding = "SIGNER_DB"
database_name = "seams-signer"
database_id = "00000000-0000-0000-0000-000000000201"
preview_database_id = "00000000-0000-0000-0000-000000000202"
migrations_dir = "../wallet-console-server-ts/node_modules/@seams/wallet-server/migrations/d1-signer"

[[services]]
binding = "MPC_ROUTER"
service = "router-ab-mpc-router"

[[services]]
binding = "SIGNING_WORKER"
service = "router-ab-signing-worker"

