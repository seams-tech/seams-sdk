name: template / deploy / cloudflare-frontend

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: Deployment target
        required: true
        type: string
      deploy_sha:
        description: Exact source revision to deploy
        required: true
        type: string
      artifact_run_id:
        description: Accepted frontend release artifact workflow run ID
        required: true
        type: string
      release_set_id:
        description: Content-addressed frontend release-set ID
        required: true
        type: string
      backend_receipt_run_id:
        description: Accepted backend coordination receipt workflow run ID
        required: true
        type: string
      source_branch:
        description: Source branch associated with the revision
        required: true
        type: string
      enforce_current_branch:
        description: Reject an automatic release after a newer frontend change
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

env:
  DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
  DEPLOY_SHA: ${{ inputs.deploy_sha }}
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
  RELEASE_SET_ID: ${{ inputs.release_set_id }}
  BACKEND_RECEIPT_RUN_ID: ${{ inputs.backend_receipt_run_id }}
  DEPLOY_SOURCE_BRANCH: ${{ inputs.source_branch }}
  ENFORCE_CURRENT_BRANCH: ${{ inputs.enforce_current_branch }}
  PAGES_BRANCH: ${{ inputs.deploy_environment == 'production' && 'main' || 'dev' }}
  PAGES_ARTIFACT_IDENTITY: '{"pagesBuild":"app-wallet-v1"}'
  SIGNER_IFRAME_ARTIFACT_IDENTITY: '{"pagesBuild":"app-wallet-v1"}'
  RELEASE_MANIFEST: .release-artifacts/release-set/manifest.json
  STAGING_GATEWAY_ORIGIN: https://seams-sdk-d1-gateway-staging.n6378056.workers.dev
  PRODUCTION_GATEWAY_ORIGIN: https://seams-sdk-d1-gateway.n6378056.workers.dev

concurrency:
  group: deployment-${{ inputs.deploy_environment }}-frontend
  cancel-in-progress: false

jobs:
  preflight_release:
    name: Verify / ${{ inputs.deploy_environment }} / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      selected_components: ${{ steps.release_identity.outputs.selected_components }}
      validation_run_id: ${{ steps.release_identity.outputs.validation_run_id }}
      has_site: ${{ steps.release_identity.outputs.has_site }}
      has_signer_iframe: ${{ steps.release_identity.outputs.has_signer_iframe }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate source branch and frontend freshness
        run: |
          set -euo pipefail
          expected_branch='dev'
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then expected_branch='main'; fi
          if [[ "$DEPLOY_ENVIRONMENT" != 'staging' && "$DEPLOY_ENVIRONMENT" != 'production' ]]; then
            echo '::error title=Unsupported frontend deployment target::Only staging and production are supported'
            exit 1
          fi
          if [[ "$DEPLOY_SOURCE_BRANCH" != "$expected_branch" ]]; then
            echo "::error title=Invalid frontend release mapping::$DEPLOY_ENVIRONMENT requires $expected_branch"
            exit 1
          fi
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error title=Invalid source SHA::Frontend deployment SHA must be a full lowercase Git SHA'
            exit 1
          }
          git fetch origin "refs/heads/$DEPLOY_SOURCE_BRANCH:refs/remotes/origin/$DEPLOY_SOURCE_BRANCH"
          branch_ref="refs/remotes/origin/$DEPLOY_SOURCE_BRANCH"
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$branch_ref"; then
            echo "::error title=Frontend release SHA is not on the protected branch::$DEPLOY_SHA is not an ancestor of $DEPLOY_SOURCE_BRANCH"
            exit 1
          fi
          if [[ "$ENFORCE_CURRENT_BRANCH" == 'true' ]]; then
            git diff --name-only "$DEPLOY_SHA..$branch_ref" > "$RUNNER_TEMP/intervening-changed-files.txt"
            intervening_frontend_components="$(node scripts/deployment-components.mjs select --files-file "$RUNNER_TEMP/intervening-changed-files.txt" --lane frontend)"
            if [[ "$intervening_frontend_components" != '[]' ]]; then
              echo "::error title=Stale frontend release skipped::A newer accepted change selects frontend components: $intervening_frontend_components"
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --filter router-ab-cloudflare

      - name: Download frontend release-set manifest
        uses: actions/download-artifact@v8
        with:
          name: release-set-${{ env.RELEASE_SET_ID }}
          path: .release-artifacts/release-set
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Download backend coordination receipt
        uses: actions/download-artifact@v8
        with:
          name: backend-coordination-receipt-${{ env.DEPLOY_ENVIRONMENT }}
          path: .release-artifacts/backend-coordination-receipt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BACKEND_RECEIPT_RUN_ID }}

      - name: Verify frontend release-set identity
        id: release_identity
        env:
          GATEWAY_API_CONTRACT_VERSION: ${{ vars.GATEWAY_API_CONTRACT_VERSION }}
        run: |
          set -euo pipefail
          node scripts/deployment-release.mjs verify \
            --manifest "$RELEASE_MANIFEST" \
            --lane frontend \
            --target "$DEPLOY_ENVIRONMENT" \
            --source-sha "$DEPLOY_SHA" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --release-set-id "$RELEASE_SET_ID"
          identity="$(node -e "const value=require('./$RELEASE_MANIFEST'); const selected=value.buildIdentity?.selectedComponents; if (!Array.isArray(selected) || selected.length === 0 || selected.some((component) => component !== 'site' && component !== 'signer-iframe')) throw new Error('frontend release set contains a backend component or no frontend component'); if (selected.includes('signer-iframe') && !selected.includes('site')) throw new Error('frontend release set requires the site component with signer-iframe'); const version=value.gatewayApiContractVersion; if (typeof version !== 'string' || version.length === 0) throw new Error('frontend release set is missing gatewayApiContractVersion'); process.stdout.write(JSON.stringify({selectedComponents:selected, validationRunId:value.acceptedValidationRunId, gatewayApiContractVersion:version}))")"
          selected_components="$(node -e "const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.selectedComponents))" "$identity")"
          validation_run_id="$(node -e "const value=JSON.parse(process.argv[1]); process.stdout.write(value.validationRunId)" "$identity")"
          gateway_api_contract_version="$(node -e "const value=JSON.parse(process.argv[1]); process.stdout.write(value.gatewayApiContractVersion)" "$identity")"
          has_site='false'
          has_signer_iframe='false'
          if [[ "$selected_components" == *'"site"'* ]]; then has_site='true'; fi
          if [[ "$selected_components" == *'"signer-iframe"'* ]]; then has_signer_iframe='true'; fi
          echo "selected_components=$selected_components" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=$validation_run_id" >> "$GITHUB_OUTPUT"
          echo "has_site=$has_site" >> "$GITHUB_OUTPUT"
          echo "has_signer_iframe=$has_signer_iframe" >> "$GITHUB_OUTPUT"
          echo "VALIDATION_RUN_ID=$validation_run_id" >> "$GITHUB_ENV"
          echo "GATEWAY_API_CONTRACT_VERSION=$gateway_api_contract_version" >> "$GITHUB_ENV"
          {
            echo '## Frontend release preflight'
            echo
            echo "- Source SHA: \`$DEPLOY_SHA\`"
            echo "- Frontend release set: \`$RELEASE_SET_ID\`"
            echo "- Validation run: \`$validation_run_id\`"
            echo "- Backend receipt run: \`$BACKEND_RECEIPT_RUN_ID\`"
            echo "- Components: \`$selected_components\`"
            echo "- Gateway API contract: \`$gateway_api_contract_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download selected site artifact
        if: steps.release_identity.outputs.has_site == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_SHA }}-pages
          path: .release-artifacts/components/site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Download selected signer iframe artifact
        if: steps.release_identity.outputs.has_signer_iframe == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_SHA }}-signer-iframe
          path: .release-artifacts/components/signer-iframe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Verify selected frontend artifacts
        run: |
          set -euo pipefail
          for component in $(node -e "const value=require('./$RELEASE_MANIFEST'); process.stdout.write(value.components.map((component) => component.name).join('\\n'))"); do
            case "$component" in
              site)
                kind='pages'
                artifact_manifest='.release-artifacts/components/site/.release-artifacts/pages/manifest.json'
                artifact_root='.release-artifacts/components/site/apps/seams-site/dist'
                identity="$PAGES_ARTIFACT_IDENTITY"
                ;;
              signer-iframe)
                kind='signer-iframe'
                artifact_manifest='.release-artifacts/components/signer-iframe/.release-artifacts/signer-iframe/manifest.json'
                artifact_root='.release-artifacts/components/signer-iframe/packages/sdk-web/dist/public/wallet-service'
                identity="$SIGNER_IFRAME_ARTIFACT_IDENTITY"
                ;;
              *)
                echo "::error title=Unexpected frontend release component::${component} is not Pages-owned"
                exit 1
                ;;
            esac
            node scripts/deployment-release.mjs verify-component \
              --manifest "$RELEASE_MANIFEST" \
              --component-name "$component" \
              --artifact-manifest "$artifact_manifest"
            node scripts/deployment-artifact.mjs verify \
              --kind "$kind" \
              --target "$DEPLOY_ENVIRONMENT" \
              --sha "$DEPLOY_SHA" \
              --root "$artifact_root" \
              --manifest "$artifact_manifest" \
              --identity-json "$identity"
          done

      - name: Verify backend coordination receipt
        run: |
          set -euo pipefail
          node scripts/deployment-coordination-receipt.mjs verify \
            --receipt-file .release-artifacts/backend-coordination-receipt/manifest.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { assertFrontendApiCompatible } from './scripts/deployment-api-compatibility.mjs';
          const receipt = JSON.parse(await readFile('.release-artifacts/backend-coordination-receipt/manifest.json', 'utf8'));
          const frontend = JSON.parse(await readFile(process.env.RELEASE_MANIFEST, 'utf8'));
          if (receipt.target !== process.env.DEPLOY_ENVIRONMENT || receipt.receiptRunId !== process.env.BACKEND_RECEIPT_RUN_ID || receipt.acceptedSourceSha !== process.env.DEPLOY_SHA || receipt.acceptedValidationRunId !== process.env.VALIDATION_RUN_ID) throw new Error('backend coordination receipt does not match frontend release identity');
          assertFrontendApiCompatible({ gatewayApiContractVersion: frontend.gatewayApiContractVersion }, receipt.supportedFrontendApiContractRange);
          NODE

  deploy_app:
    name: Deploy / ${{ inputs.deploy_environment }} / cloudflare-pages / app
    if: >-
      ${{
        needs.preflight_release.result == 'success' &&
        needs.preflight_release.outputs.has_site == 'true'
      }}
    needs: preflight_release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: ${{ format('{0}-frontend', inputs.deploy_environment) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT_VITE }}
      PAGES_ORIGIN: ${{ vars.VITE_DOCS_ORIGIN }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            crates/router-ab-cloudflare
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter router-ab-cloudflare

      - name: Download frontend release-set manifest
        uses: actions/download-artifact@v8
        with:
          name: release-set-${{ env.RELEASE_SET_ID }}
          path: .release-artifacts/release-set
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Download Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_SHA }}-pages
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Verify app Pages artifact
        run: |
          set -euo pipefail
          node scripts/deployment-release.mjs verify \
            --manifest "$RELEASE_MANIFEST" \
            --lane frontend \
            --target "$DEPLOY_ENVIRONMENT" \
            --source-sha "$DEPLOY_SHA" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --release-set-id "$RELEASE_SET_ID"
          node scripts/deployment-release.mjs verify-component \
            --manifest "$RELEASE_MANIFEST" \
            --component-name site \
            --artifact-manifest .release-artifacts/pages/manifest.json
          node scripts/deployment-artifact.mjs verify \
            --kind pages \
            --target "$DEPLOY_ENVIRONMENT" \
            --sha "$DEPLOY_SHA" \
            --root apps/seams-site/dist \
            --manifest .release-artifacts/pages/manifest.json \
            --identity-json "$PAGES_ARTIFACT_IDENTITY"

      - name: Deploy app Pages
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is not set' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is not set' >&2; exit 1; }
          test -n "${CF_PAGES_PROJECT:-}" || { echo 'CF_PAGES_PROJECT_VITE is not set' >&2; exit 1; }
          test -n "${PAGES_ORIGIN:-}" || { echo 'VITE_DOCS_ORIGIN is not set' >&2; exit 1; }
          pnpm -C crates/router-ab-cloudflare exec wrangler pages deploy ../../apps/seams-site/dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "$DEPLOY_SHA" \
            --commit-dirty=false

      - name: Verify app readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 5 "$PAGES_ORIGIN/" > /dev/null
          curl --fail --silent --show-error --max-time 5 "$PAGES_ORIGIN/sdk/workers/near-signer.worker.js" > /dev/null

      - name: Summarize app deployment
        run: |
          manifest_digest="$(node -e "const value=require('./.release-artifacts/pages/manifest.json'); process.stdout.write(value.contentDigestSha256)")"
          {
            echo '## App Pages deployment'
            echo
            echo "- Source SHA: \`$DEPLOY_SHA\`"
            echo "- Frontend release set: \`$RELEASE_SET_ID\`"
            echo "- Frontend artifact run: \`$ARTIFACT_RUN_ID\`"
            echo "- Backend receipt run: \`$BACKEND_RECEIPT_RUN_ID\`"
            echo "- Artifact content digest: \`$manifest_digest\`"
            echo "- URL: $PAGES_ORIGIN"
            echo '- Readiness: app and SDK worker passed'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_wallet:
    name: Deploy / ${{ inputs.deploy_environment }} / cloudflare-pages / wallet
    if: >-
      ${{
        needs.preflight_release.result == 'success' &&
        needs.preflight_release.outputs.has_site == 'true'
      }}
    needs: preflight_release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: ${{ format('{0}-frontend', inputs.deploy_environment) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT_WALLET }}
      PAGES_ORIGIN: ${{ vars.VITE_WALLET_ORIGIN }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            crates/router-ab-cloudflare
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --filter router-ab-cloudflare

      - name: Download frontend release-set manifest
        uses: actions/download-artifact@v8
        with:
          name: release-set-${{ env.RELEASE_SET_ID }}
          path: .release-artifacts/release-set
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Download Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.DEPLOY_SHA }}-pages
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Verify wallet Pages artifact
        run: |
          set -euo pipefail
          node scripts/deployment-release.mjs verify \
            --manifest "$RELEASE_MANIFEST" \
            --lane frontend \
            --target "$DEPLOY_ENVIRONMENT" \
            --source-sha "$DEPLOY_SHA" \
            --artifact-run-id "$ARTIFACT_RUN_ID" \
            --release-set-id "$RELEASE_SET_ID"
          node scripts/deployment-release.mjs verify-component \
            --manifest "$RELEASE_MANIFEST" \
            --component-name site \
            --artifact-manifest .release-artifacts/pages/manifest.json
          node scripts/deployment-artifact.mjs verify \
            --kind pages \
            --target "$DEPLOY_ENVIRONMENT" \
            --sha "$DEPLOY_SHA" \
            --root apps/seams-site/dist \
            --manifest .release-artifacts/pages/manifest.json \
            --identity-json "$PAGES_ARTIFACT_IDENTITY"

      - name: Deploy wallet Pages
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is not set' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is not set' >&2; exit 1; }
          test -n "${CF_PAGES_PROJECT:-}" || { echo 'CF_PAGES_PROJECT_WALLET is not set' >&2; exit 1; }
          test -n "${PAGES_ORIGIN:-}" || { echo 'VITE_WALLET_ORIGIN is not set' >&2; exit 1; }
          pnpm -C crates/router-ab-cloudflare exec wrangler pages deploy ../../apps/seams-site/dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "$DEPLOY_SHA" \
            --commit-dirty=false

      - name: Verify wallet readiness
        run: |
          set -euo pipefail
          for path in \
            /wallet-service/index.html \
            /sdk/workers/near-signer.worker.js \
            /sdk/workers/router_ab_ed25519_yao_client_bg.wasm
          do
            curl --fail --silent --show-error --max-time 5 "$PAGES_ORIGIN$path" > /dev/null
          done

      - name: Summarize wallet deployment
        run: |
          manifest_digest="$(node -e "const value=require('./.release-artifacts/pages/manifest.json'); process.stdout.write(value.contentDigestSha256)")"
          {
            echo '## Wallet Pages deployment'
            echo
            echo "- Source SHA: \`$DEPLOY_SHA\`"
            echo "- Frontend release set: \`$RELEASE_SET_ID\`"
            echo "- Frontend artifact run: \`$ARTIFACT_RUN_ID\`"
            echo "- Backend receipt run: \`$BACKEND_RECEIPT_RUN_ID\`"
            echo "- Artifact content digest: \`$manifest_digest\`"
            echo "- URL: $PAGES_ORIGIN"
            echo '- Readiness: wallet service, SDK worker, and WASM passed'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend_smoke:
    name: Verify / ${{ inputs.deploy_environment }} / frontend / smoke
    if: >-
      ${{
        always() &&
        needs.preflight_release.result == 'success' &&
        needs.preflight_release.outputs.has_site == 'true' &&
        needs.deploy_app.result == 'success' &&
        needs.deploy_wallet.result == 'success'
      }}
    needs:
      - preflight_release
      - deploy_app
      - deploy_wallet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download frontend release-set manifest
        uses: actions/download-artifact@v8
        with:
          name: release-set-${{ env.RELEASE_SET_ID }}
          path: .release-artifacts/release-set
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Run frontend smoke
        env:
          SITE_ORIGIN: ${{ vars.VITE_DOCS_ORIGIN }}
          WALLET_ORIGIN: ${{ vars.VITE_WALLET_ORIGIN }}
          SELECTED_COMPONENTS: ${{ needs.preflight_release.outputs.selected_components }}
        run: |
          set -euo pipefail
          node scripts/deployment-final-smoke.mjs \
            --manifest "$RELEASE_MANIFEST" \
            --release-set-id "$RELEASE_SET_ID" \
            --selected-components "$SELECTED_COMPONENTS" \
            --site-origin "$SITE_ORIGIN" \
            --wallet-origin "$WALLET_ORIGIN"
          {
            echo '## Frontend smoke'
            echo
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Source SHA: \`$DEPLOY_SHA\`"
            echo "- Frontend release set: \`$RELEASE_SET_ID\`"
            echo "- Backend receipt run: \`$BACKEND_RECEIPT_RUN_ID\`"
            echo "- Components: \`$SELECTED_COMPONENTS\`"
            echo '- App Pages, wallet Pages, SDK runtime assets, and release identity passed.'
          } >> "$GITHUB_STEP_SUMMARY"
