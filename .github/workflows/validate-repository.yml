name: Validate / repository

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - 'tests/**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-ab-deployment-validation:
    name: Router A/B deployment validation
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run Router A/B core and adapter tests
        run: |
          cargo test --manifest-path crates/router-ab-core/Cargo.toml
          cargo test --manifest-path crates/router-ab-dev/Cargo.toml
          cargo test --manifest-path crates/router-ab-cloudflare/Cargo.toml --features workers-rs

      - name: Check strict Worker entrypoints
        run: |
          set -euo pipefail
          for feature in \
            strict-worker-router-entrypoint \
            strict-worker-deriver-a-entrypoint \
            strict-worker-deriver-b-entrypoint \
            strict-worker-signing-worker-entrypoint
          do
            cargo check --manifest-path crates/router-ab-cloudflare/Cargo.toml --features "$feature"
          done

  ed25519-yao-constant-time-codegen:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # check_constant_time_codegen.mjs runs three cold --release builds (native,
    # then both cross-account Worker features) into a throwaway CARGO_TARGET_DIR,
    # because the codegen it asserts on has to come from a clean compile. That
    # does not fit in 30 minutes on a hosted runner -- the job was cancelled at
    # the cap on every dispatch since it was added. A cap is a safety net, not a
    # budget: billing follows actual minutes, so give it room to finish.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The script's temp target dir defeats artifact caching by design; this
      # still spares the crates.io index and dependency downloads.
      - name: Cache Ed25519-Yao Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ed25519-yao-constant-time-${{ runner.os }}
          cache-targets: 'false'

      - name: Add Worker WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install LLVM WASM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          command -v llvm-objdump

      - name: Inspect optimized native and Worker-WASM secret selection
        run: node crates/ed25519-yao/scripts/check_constant_time_codegen.mjs

  build-and-test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust components (rustfmt + clippy)
        run: rustup component add rustfmt clippy

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build production WASM for type checking
        run: WASM_SDK_BUILD_MODE=prod pnpm build:wasm

      - name: Build server packages for type checking
        run: |
          pnpm -C packages/wallet-server build
          pnpm -C packages/console-server-ts build

      - name: Check lint, types, Rust, and architecture
        run: |
          pnpm lint
          pnpm type-check
          pnpm check:docs-links
          pnpm check:docs-fences
          pnpm format:rust:check
          pnpm lint:rust
          pnpm check:signing-architecture

      - name: Build documentation
        run: pnpm docs:build

      - name: Setup Bun (for worker bundling)
        uses: oven-sh/setup-bun@v2

      - name: Install Playwright (Chromium + system deps)
        run: pnpm -C tests exec playwright install --with-deps chromium

      - name: Install Caddy for Console operating paths
        run: |
          sudo apt-get update
          sudo apt-get install --yes caddy

      - name: Run documentation browser smoke
        run: pnpm docs:test

      - name: Build SDK (production)
        env:
          WASM_SDK_USE_PREBUILT: '1'
        run: pnpm -C packages/wallet run build:prod

      - name: Assert generated palette CSS
        run: node packages/wallet/scripts/checks/assert-palette-css.mjs

      - name: Run signer runtime gates
        run: pnpm -C tests exec playwright test ./unit/walletSessionReadiness.gate.unit.test.ts ./unit/thresholdEcdsa.commitQueue.unit.test.ts ./unit/walletIframeHost.signTempoCancel.unit.test.ts --reporter=line

      - name: Run signer parity tests
        run: pnpm -C tests exec playwright test -c playwright.unit.config.ts ./unit/signerParity.rustPlatforms.unit.test.ts ./unit/signingVectors.webWasmReplay.integration.test.ts --workers=1

      # The console harness boots the local Router A/B stack, which refuses to
      # start without the strict Worker artifacts and their build receipt. The
      # SDK step above runs only the wallet half of `build:sdk-prod`; the other
      # half is `pnpm router:build`, so it has to run here. The dev profile
      # keeps this inside the job budget -- these paths assert behaviour, not
      # optimized codegen.
      - name: Install worker-build
        run: pnpm -C crates/router-ab-cloudflare run worker-build:install

      - name: Build Router A/B Worker artifacts
        env:
          ROUTER_AB_WORKER_BUILD_PROFILE: dev
        run: pnpm router:build

      - name: Run Console operating paths
        env:
          SEAMS_INTENDED_SKIP_BUILD: '1'
        run: pnpm test:console

      - name: Upload Console operating-path artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console-operating-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: tests/test-results

  threshold-signing-core:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Setup Bun (for worker bundling)
        uses: oven-sh/setup-bun@v2

      - name: Install Playwright (Chromium + system deps)
        run: pnpm -C tests exec playwright install --with-deps chromium

      - name: Build SDK (production)
        run: pnpm -C packages/wallet run build:prod

      - name: Smoke check EVM crypto runtime loading (Node + Workers)
        run: pnpm -C packages/wallet smoke:evm-crypto:runtimes

      - name: Run threshold signing core suites
        run: pnpm test:threshold-core

      - name: Upload threshold-core test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: threshold-core-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            packages/wallet/playwright-report
            packages/wallet/test-results
