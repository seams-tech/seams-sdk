name: Deploy / production / frontend
run-name: deploy / production / frontend / ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-production-frontend
  cancel-in-progress: false

env:
  DEPLOY_SITE: production
  DEPLOY_SHA: ${{ github.sha }}
  RUST_TOOLCHAIN: 1.96.0

jobs:
  deploy:
    name: Deploy / production / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_VITE: ${{ secrets.CF_PAGES_PROJECT_VITE }}
      CF_PAGES_PROJECT_DOCS: ${{ secrets.CF_PAGES_PROJECT_DOCS }}
      CF_PAGES_PROJECT_WALLET_TESTNET: ${{ secrets.CF_PAGES_PROJECT_WALLET_TESTNET }}
      CF_PAGES_PROJECT_WALLET_MAINNET: ${{ secrets.CF_PAGES_PROJECT_WALLET_MAINNET }}
      VITE_TESTNET_SEAMS_PROJECT_ENVIRONMENT_ID: ${{ vars.VITE_TESTNET_SEAMS_PROJECT_ENVIRONMENT_ID }}
      VITE_TESTNET_SEAMS_PUBLISHABLE_KEY: ${{ vars.VITE_TESTNET_SEAMS_PUBLISHABLE_KEY }}
      VITE_TESTNET_NEAR_NETWORK: ${{ vars.VITE_TESTNET_NEAR_NETWORK }}
      VITE_TESTNET_NEAR_RPC_URL: ${{ vars.VITE_TESTNET_NEAR_RPC_URL }}
      VITE_TESTNET_NEAR_EXPLORER: ${{ vars.VITE_TESTNET_NEAR_EXPLORER }}
      VITE_TESTNET_TEMPO_RPC_URL: ${{ vars.VITE_TESTNET_TEMPO_RPC_URL }}
      VITE_TESTNET_TEMPO_EXPLORER: ${{ vars.VITE_TESTNET_TEMPO_EXPLORER }}
      VITE_TESTNET_TEMPO_FEE_TOKEN: ${{ vars.VITE_TESTNET_TEMPO_FEE_TOKEN }}
      VITE_TESTNET_ARC_RPC_URL: ${{ vars.VITE_TESTNET_ARC_RPC_URL }}
      VITE_TESTNET_ARC_EXPLORER: ${{ vars.VITE_TESTNET_ARC_EXPLORER }}
      VITE_TESTNET_WALLET_SERVICE_PATH: ${{ vars.VITE_TESTNET_WALLET_SERVICE_PATH }}
      VITE_TESTNET_SDK_BASE_PATH: ${{ vars.VITE_TESTNET_SDK_BASE_PATH }}
      VITE_TESTNET_SIGNING_SESSION_PERSISTENCE_MODE: ${{ vars.VITE_TESTNET_SIGNING_SESSION_PERSISTENCE_MODE }}
      VITE_TESTNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID: ${{ vars.VITE_TESTNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID }}
      VITE_MAINNET_SEAMS_PROJECT_ENVIRONMENT_ID: ${{ vars.VITE_MAINNET_SEAMS_PROJECT_ENVIRONMENT_ID }}
      VITE_MAINNET_SEAMS_PUBLISHABLE_KEY: ${{ vars.VITE_MAINNET_SEAMS_PUBLISHABLE_KEY }}
      VITE_MAINNET_NEAR_NETWORK: ${{ vars.VITE_MAINNET_NEAR_NETWORK }}
      VITE_MAINNET_NEAR_RPC_URL: ${{ vars.VITE_MAINNET_NEAR_RPC_URL }}
      VITE_MAINNET_NEAR_EXPLORER: ${{ vars.VITE_MAINNET_NEAR_EXPLORER }}
      VITE_MAINNET_WALLET_SERVICE_PATH: ${{ vars.VITE_MAINNET_WALLET_SERVICE_PATH }}
      VITE_MAINNET_SDK_BASE_PATH: ${{ vars.VITE_MAINNET_SDK_BASE_PATH }}
      VITE_MAINNET_SIGNING_SESSION_PERSISTENCE_MODE: ${{ vars.VITE_MAINNET_SIGNING_SESSION_PERSISTENCE_MODE }}
      VITE_MAINNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID: ${{ vars.VITE_MAINNET_ROUTER_AB_NORMAL_SIGNING_WORKER_ID }}
      VITE_DASHBOARD_WALLETS_ROUTES_ENABLED: ${{ vars.VITE_DASHBOARD_WALLETS_ROUTES_ENABLED }}
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install pinned WASM tooling
        run: bash packages/wallet/scripts/build/install-ci-wasm-tooling.sh
      - name: Build frontend
        run: pnpm deploy:frontend build --site "$DEPLOY_SITE"
      - name: Deploy Pages
        run: pnpm deploy:frontend deploy --site "$DEPLOY_SITE"
      - name: Smoke frontend
        run: pnpm deploy:frontend smoke --site "$DEPLOY_SITE"
